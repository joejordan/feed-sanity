name: Verify Build & Tests
description: Install dependencies, run static/unit checks, build & package Chrome/Firefox/userscript artifacts, lint Firefox AMO package, and run Chromium + Firefox E2E suites.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Typecheck, lint, and unit tests
      shell: bash
      run: pnpm check
    - name: Build and zip extensions + userscript
      shell: bash
      # `pnpm zip` runs `wxt zip` for Firefox & Chrome (which builds `.output/firefox-mv2`
      # and `.output/chrome-mv3` before zipping), avoiding a redundant double WXT build.
      run: pnpm zip && pnpm build:userscript
    - name: Lint Firefox add-on package (AMO rules)
      shell: bash
      run: pnpm dlx addons-linter@10.16.0 .output/feed-sanity-*-firefox.zip
    - name: Install Playwright's Chromium
      shell: bash
      run: pnpm exec playwright install --with-deps --no-shell chromium
    - name: Chromium end-to-end tests
      id: e2e
      shell: bash
      run: pnpm test:e2e:only
    - name: Upload Playwright report and traces on failure
      if: failure() && steps.e2e.outcome == 'failure'
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 14
    - name: Install Firefox for BiDi smoke test
      uses: browser-actions/setup-firefox@v1
      with:
        firefox-version: latest
    - name: Firefox MV2 BiDi smoke test
      shell: bash
      run: pnpm test:firefox
