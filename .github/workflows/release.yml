name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER="$(node -p "require('./package.json').version")"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "Tag v${TAG_VER} does not match package.json version ${PKG_VER}" >&2
            exit 1
          fi
      - uses: ./.github/actions/verify
      - name: Stage release artifacts and checksums
        run: |
          mkdir -p release-assets
          cp .output/feed-sanity-*-chrome.zip release-assets/
          cp .output/feed-sanity-*-firefox.zip release-assets/
          cp .output/feed-sanity-*-sources.zip release-assets/
          cp .output/userscript/feed-sanity.user.js release-assets/
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          ls -lh release-assets
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: feed-sanity-release-assets
          path: release-assets/
          retention-days: 30

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: feed-sanity-release-assets
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "Feed Sanity $GITHUB_REF_NAME" \
            --generate-notes
