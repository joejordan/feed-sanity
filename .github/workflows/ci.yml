name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version named in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      # The end-to-end tests run the Chrome build from the step above in
      # Playwright's Chromium. Only that browser is installed, without the
      # headless shell, which cannot load extensions. It is not cached: the
      # system libraries have to be installed on every run anyway, and
      # restoring the browser from a cache takes about as long as downloading it.
      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps --no-shell chromium
      - name: End-to-end tests
        id: e2e
        run: pnpm exec playwright test -c e2e
      - name: Upload the Playwright report and traces
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
