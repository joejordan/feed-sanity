<!doctype html>
<!--
  A stand-in for Facebook's stories viewer, served at
  https://www.facebook.com/stories/. The markup follows what docs/facebook-notes.md
  records under "A look at the stories viewer on 2026-11-14": a top bar with
  two labelled navigation elements, and down the left an unlabelled
  navigation element holding the "All stories" list, whose entries are
  div[role=button][id]. A wrapper inside it stands in for Facebook's
  StoriesSuspenseNavigationPanePauseContainer.

  The script pauses the story while the pointer or focus is inside the
  wrapper and plays it when they leave, worked out from mouseout, mouseover,
  focusin and focusout at the document the way React works out
  onMouseEnter, onMouseLeave, onFocus and onBlur. It applies a request on the
  next task, as Facebook did on the live site: a leave in the same task as
  the enter left no pause event there.

  Every name and text is invented. The clip is the one pages/videos/ plays.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Facebook</title>
    <style>
      body {
        margin: 0;
        font: 15px sans-serif;
      }
      [role='banner'] {
        position: fixed;
        top: 0;
        right: 0;
        left: 0;
        display: flex;
        gap: 16px;
        align-items: center;
        height: 56px;
        padding: 0 16px;
        border-bottom: 1px solid #ccc;
        background: #fff;
      }
      #pane {
        position: fixed;
        top: 56px;
        bottom: 0;
        left: 0;
        width: 360px;
        overflow-y: auto;
        border-right: 1px solid #ccc;
      }
      #pane [role='button'] {
        padding: 16px;
      }
      #pane [role='button']:hover {
        background: #eee;
      }
      [role='main'] {
        position: fixed;
        top: 56px;
        right: 0;
        bottom: 0;
        left: 361px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      [role='main'] video {
        width: 300px;
        height: 533px;
      }
    </style>
  </head>
  <body>
    <div id="mount_0_0_e2e">
      <div role="banner">
        <div role="navigation" aria-label="Facebook">
          <div role="button" tabindex="0" id="close">Close</div>
        </div>
        <div role="navigation" aria-label="Account">
          <div role="button" tabindex="0" id="menu">Menu</div>
        </div>
      </div>
      <div id="pane">
        <div role="navigation">
          <h2 id="heading">All stories</h2>
          <div id="pause-container">
            <div role="button" tabindex="0" id="300000000000001">Juniper Hale</div>
            <div role="button" tabindex="0" id="300000000000002">Rowan Ellis</div>
            <div role="button" tabindex="0" id="300000000000003">Sasha Quint</div>
          </div>
        </div>
      </div>
      <div role="main">
        <div id="story"><video playsinline muted autoplay loop></video></div>
      </div>
    </div>

    <script>
      const video = document.querySelector('video');
      fetch('/videos/clip.webm')
        .then((response) => response.blob())
        .then((blob) => {
          video.src = URL.createObjectURL(blob);
        });

      // What the page asked of the story, and how often the story paused.
      const requests = [];
      let pauses = 0;
      video.addEventListener('pause', () => {
        pauses++;
        document.body.dataset.pauses = String(pauses);
      });

      const wrapper = document.querySelector('#pause-container');
      const inside = (node) => node instanceof Node && wrapper.contains(node);
      let paused = false;
      const requestPause = (pause) => {
        paused = pause;
        requests.push(pause ? 'pause' : 'play');
        document.body.dataset.requests = requests.join(' ');
        setTimeout(() => {
          if (paused) {
            video.pause();
          } else if (video.paused) {
            video.play();
          }
        }, 0);
      };

      document.addEventListener('mouseout', ({ target, relatedTarget }) => {
        if (inside(target) && !inside(relatedTarget)) {
          requestPause(false);
        } else if (!inside(target) && inside(relatedTarget)) {
          requestPause(true);
        }
      });
      // React reads a mouseover only when the pointer comes from outside the
      // document, or from an element it no longer knows.
      document.addEventListener('mouseover', ({ target, relatedTarget }) => {
        const known = relatedTarget instanceof Node && relatedTarget.isConnected;
        if (!known && inside(target)) {
          requestPause(true);
        }
      });
      document.addEventListener('focusin', ({ target }) => {
        if (inside(target)) {
          requestPause(true);
        }
      });
      document.addEventListener('focusout', ({ target }) => {
        if (inside(target)) {
          requestPause(false);
        }
      });

      // Closing the viewer goes back to the feed without a reload.
      document.querySelector('#close').addEventListener('click', () => {
        history.pushState({}, '', '/');
        document.querySelector('#pane').remove();
      });
    </script>
  </body>
</html>
